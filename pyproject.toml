[build-system]
requires = ["setuptools >= 45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pypistrello"
dynamic = ["version"]
description = "Python Program for Integrating Spectral lines using TRapezoids, Error estimation and Line fLux Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "María Chillarón", email = "mariachillaronv@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "teareduce",
    "numina"
]

[project.optional-dependencies]
test = [
    "pytest>=6",
    "pytest-remotedata",
]

[project.urls]
Homepage = "https://github.com/mchillaron/pypistrello"
Repository = "https://github.com/mchillaron/pypistrello.git"

[project.scripts]
pypistrello = "pypistrello.analysis_spectral_lines:main"

# pyproject.toml
[tool.setuptools_scm]
write_to = "src/pypistrello/_version.py"

# without this, still works, performs autodetection
[tool.setuptools.packages.find]
where = ["src"]