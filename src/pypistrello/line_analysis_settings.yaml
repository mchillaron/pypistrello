line_name: "Hα"  #"$\mathrm{H}\alpha$"
line_restframe: [6562.8]
redshift: 0.002682

# ============================================================================
# pypistrello configuration
# ============================================================================

# Settings for the diagnostic plot, in which the regions to be analysed and
# excluded are selected.
reg_int_spec: [x1, x2, y1, y2]        # region to integrate spectra. FITS criterium
wavelength_file: null                 # CSV with wavelength axis; if null, it will be computed from FITS headers
zoom_plot: [xmin, xmax]               # xmin and xmax for the fitting plots
y_padding: 0.10                       # fraction to adjust y-axis
reg_continuum: [λleft, λright]        # wavelength range for continuum
reg_fitting: [λleft, λright]          # wavelength range including the line
reg_excluded:                         # wavelength range(s) to exclude from the continuum
# - [λleft, λright]                              
window_continuum: null                # number of pixels from the line onwards to consider cont (semi-width)
window_fitting: null                  # number of pixels from the line onwards to fit the line (semi-width)

#-----------------------------------------------------------------------------
# Settings for the AREA calculation using trapezoids.
poly_order_cont: 1              # order of the polynomial that fits the continuum
manual_trapz_check: True        # If True, trapezoids performed manually too (if False, numpy.trapezoids).
trapz_nbins: 100                # Number of bins for the manual mode.

#-----------------------------------------------------------------------------
# Settings for offset and VELOCITY calculation.
ref_spec: [x,y]     # (x,y) of the spectrum used as reference for crosscorr. FITS criterium

#-----------------------------------------------------------------------------
# Settings for LINE-FITTING
line_model_fit: True            # Perform the fitting of the line
plot_residuals: True            # Save plots of residuals 

#-----------------------------------------------------------------------------
# Settings for plotting outputs after analysis.
plot_simulated_spectra: False   # Add simulated spectra to the plots if provided.
save_pdf: False                 # Save a PDF with plots showing the analysis               
pdf_name: "plots_analysis.pdf"  # PDF name
plots_per_page: [4, 2]          # (rows, cols) for the subplot distribution per PDF page
show_preview:                   # While running, show the plots for spectrum coord (X, Y). FITS criterium
# - [X, Y] 

# ============================================================================
# pypistrello-plotting configuration
# ============================================================================
# Each map section defines how a specific 2D map is generated
# and visualized from the analysis results.
# ============================================================

flux_map:
  data_column: "line_flux_trapz"              # Name of the column in the FITS table used to build the map
  colorbar_label: "$\mathrm{Flux\ [erg\ s^{-1}\ cm^{-2}\ \AA^{-1}]}$"        # Colorbar label
  cmap: "plasma"                              # Matplotlib colormap used for the image
  vmin:                                       # Minimum value for color scaling (leave empty for automatic zscale)
  vmax:                                       # Maximum value for color scaling (leave empty for automatic zscale)
  zscale_factor: 0.05                         # Fraction of the data range used for contrast scaling (default 0.05) (e.g., for percentile- or zscale-based normalization)
  wcs_activate: True                         # If True, use WCS information for axis projection
  calculate_contours: True                    # If True, compute and overlay contours on this map
  contour_levels: 7                           # Number of contour levels to compute (default 7)
  interpolate: False                          # If True, interpolate scattered data to fill missing pixels
  interpolation_method: "nearest"             # Interpolation method used when interpolate is True. Options: nearest, linear, cubic
  background: "transparent"                   # Background type of the output image (e.g., transparent or white)
  visualize: True                             # If True, generate and display/save this map

velocity_map:
  data_column: "velocity"           
  colorbar_label: "$\mathrm{Velocity\ [km/s]}$" #"Velocity [km/s]" 
  cmap: "seismic"                   
  vmin: -100
  vmax: 100
  zscale_factor: 0.05
  wcs_activate: True
  add_flux_contours: True
  flux_contour_file: flux_contours.npy
  contours_color: "black"
  interpolate: False                
  interpolation_method: "nearest"   
  background: "transparent"         
  visualize: True 