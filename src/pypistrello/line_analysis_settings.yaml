line_restframe: 6562.8
line_name: "Halpha"

# General settings for the plots and PDFs saved in the output directory.
general:
  manual_trapz_check: True        # If True, the calculation of trapezoids is also calculated manually (if False, only numpy.trapezoids is used).
  trapz_nbins: 100                # Number of bins for the area calculation using trapezoids in the manual mode.
  plot_residuals: True            # Save plots with the residuals of line-fitting.
  plot_simulated_spectra: False   # Add simulated spectra to the plots if provided.

plotting:
  zoom_plot: [6526.71, 6650.69]   # xmin and xmax for the fitting plots
  y_padding: 0.10                 # fraction to adapt the y-axis depending on the y-values in the plot

  plots_per_page: [4, 2]          # rows, cols
  show_preview: False
  save_pdf: False                              
  pdf_name: "plots_trapz_spectrum.pdf"

# Line-fitting settings
line:
  window_line:
  fit_region: [6574.09, 6586.64]
  line_model_fit: True             
 
# Continuum-fitting settings
continuum:
  window_cont:
  continuum_region: [6530.54, 6643.57]
  excluded_region:
    - [6563.52, 6567.46]
    - [6598.46, 6603.96]
  poly_order_cont: 1

# Crosscorrelation
crosscorr:
  reference_spectrum: [87, 97]      # (x,y) coordinates in FITS format

# ============================================================
# Map-plotting configuration
# Each map section defines how a specific 2D map is generated
# and visualized from the analysis results.
# ============================================================

flux_map:
  data_column: "line_flux_trapz"              # Name of the column in the FITS table used to build the map
  colorbar_label: "Flux [erg/s/cm²/A]"        # Label shown next to the colorbar (including physical units)
  cmap: "plasma"                              # Matplotlib colormap used for the image
  vmin:                                       # Minimum value for color scaling (leave empty for automatic zscale)
  vmax:                                       # Maximum value for color scaling (leave empty for automatic zscale)
  zscale_factor: 0.05                         # Fraction of the data range used for contrast scaling (default 0.05) (e.g., for percentile- or zscale-based normalization)
  wcs_activate: True                         # If True, use WCS information for axis projection
  calculate_contours: True                    # If True, compute and overlay contours on this map
  contour_levels: 7                           # Number of contour levels to compute (default 7)
  interpolate: False                          # If True, interpolate scattered data to fill missing pixels
  interpolation_method: "nearest"             # Interpolation method used when interpolate is True. Options: nearest, linear, cubic
  background: "transparent"                   # Background type of the output image (e.g., transparent or white)
  visualize: True                             # If True, generate and display/save this map

velocity_map:
  data_column: "velocity"           
  colorbar_label: "Velocity [km/s]" 
  cmap: "seismic"                   
  vmin: -100
  vmax: 100
  zscale_factor: 0.05
  wcs_activate: True
  add_flux_contours: True
  flux_contour_file: flux_contours.npy
  contours_color: "black"
  interpolate: False                
  interpolation_method: "nearest"   
  background: "transparent"         
  visualize: True                   